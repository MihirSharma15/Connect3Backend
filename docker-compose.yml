version: '3.8'

services:
  connect3v3:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: always
    networks:
      - mynetwork
    deploy:
      update_config:
        order: start-first   # Ensures the new container starts before the old one is stopped

  caddy:
    image: caddy:2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
    networks:
      - mynetwork
    restart: always

networks:
  mynetwork:
    external: true